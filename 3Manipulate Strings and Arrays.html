<!DOCTYPE html>
<html>

<head>
    <title>Mini Text Analyzer</title>
</head>

<body>

    <h2>Mini Text Analyzer</h2>

    <textarea id="paragraphInput" rows="8" cols="60"
        placeholder="Enter paragraph"></textarea>
    <br><br>

    <button onclick="analyzeText()">Analyze</button>

    <pre id="output"></pre>

    <script>
        function analyzeText() {

            const text = document.getElementById("paragraphInput").value;

            const totalChars = text.length;

            const words = text.match(/\b\w+\b/g) || [];
            const totalWords = words.length;

            const totalSentences = (text.match(/[.!?]/g) || []).length;

            const uniqueWords = [...new Set(words.map(function(word) {
                return word.toLowerCase();
            }))];

            const freq = {};

            words.forEach(function(word) {
                const w = word.toLowerCase();

                if (freq[w]) {
                    freq[w]++;
                } else {
                    freq[w] = 1;
                }
            });

            const sortedFreq = Object.entries(freq).sort(function(a, b) {
                return b[1] - a[1];
            });

            let output = "";
            output += "Total Characters: " + totalChars + "\n";
            output += "Total Words: " + totalWords + "\n";
            output += "Total Sentences: " + totalSentences + "\n";
            output += "Unique Words: " + uniqueWords.join(", ") + "\n\n";
            output += "Word Frequency:\n";

            sortedFreq.forEach(function(item) {
                output += item[0] + ": " + item[1] + "\n";
            });

            document.getElementById("output").textContent = output;
        }
    </script>

</body>

</html>
